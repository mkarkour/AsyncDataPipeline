[project]
name = "asyncdatapipeline"
version = "0.1.0"
description = "Asynchronous fan-in / transform / fan-out data pipeline library."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "mkarkour", email = "karmehdi@hotmail.com" }
]
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.7",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "ANN", "W"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.mypy]
strict = true